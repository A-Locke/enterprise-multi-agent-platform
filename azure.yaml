# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: enterprise-multi-agent-platform

infra:
  provider: bicep
  path: infra
  module: main

services:
  api:
    project: ./apps/api
    language: python
    host: containerapp
    docker:
      path: Dockerfile
      # remoteBuild (ACR Tasks) was tried first to avoid depending on a running local
      # Docker daemon, but this subscription has ACR Tasks disabled entirely
      # (TasksOperationsNotAllowed -- a platform restriction, not something fixable via
      # config; see PROJECT_JOURNAL.md). Local Docker build is the fallback; CI will need
      # Docker available on the runner (GitHub-hosted runners have it by default).

# Further services (functions, web) are added as later milestones land.
