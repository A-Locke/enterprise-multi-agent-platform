# Manual trigger only -- deliberately not on push. Every infra change this project has made
# went through an explicit, reviewed `az deployment` call; auto-deploying on every push to
# main would be a real behavior change from that practice, not something to inherit silently
# from azd's generated template default.
on:
  workflow_dispatch:

# Set up permissions for deploying with secretless Azure federated credentials
# https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure?tabs=azure-portal%2Clinux#set-up-azure-login-with-openid-connect-authentication
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_PRINCIPAL_ID: ${{ secrets.AZURE_PRINCIPAL_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ secrets.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}
      BUDGET_NOTIFICATION_EMAIL: ${{ secrets.BUDGET_NOTIFICATION_EMAIL }}
      APIM_PUBLISHER_EMAIL: ${{ secrets.APIM_PUBLISHER_EMAIL }}
      APIM_PUBLISHER_NAME: ${{ secrets.APIM_PUBLISHER_NAME }}
      AZURE_API_APP_CLIENT_ID: ${{ secrets.AZURE_API_APP_CLIENT_ID }}
      LOCAL_DEV_PRINCIPAL_ID: ${{ secrets.LOCAL_DEV_PRINCIPAL_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in with Azure (Federated Credentials)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"
        shell: bash

      - name: Provision Infrastructure
        run: |
          # `azd env new` doesn't inherit AZURE_SUBSCRIPTION_ID/AZURE_LOCATION from process
          # env into azd's own environment state -- must pass them explicitly, or azd's
          # internal "current principal id" lookup requests /subscriptions/ with an empty
          # subscription segment and gets a 404 MissingSubscription.
          azd env new "$AZURE_ENV_NAME" --subscription "$AZURE_SUBSCRIPTION_ID" --location "$AZURE_LOCATION" --no-prompt
          echo "--- azd env get-values raw (temporary debug -- GH auto-masks registered secret values) ---"
          azd env get-values
          echo "--- lengths (via eval, to handle quoting correctly) ---"
          eval "$(azd env get-values)"
          echo "AZURE_ENV_NAME length: ${#AZURE_ENV_NAME}"
          echo "AZURE_LOCATION length: ${#AZURE_LOCATION}"
          echo "AZURE_SUBSCRIPTION_ID length: ${#AZURE_SUBSCRIPTION_ID}"
          # azd normally resolves the current-principal-id by looking up the interactively
          # signed-in user via Microsoft Graph -- there is no such user under
          # federated/managed-identity CI auth, so it must be set explicitly per-environment
          # too (see .env.example for where this value comes from).
          azd env set AZURE_PRINCIPAL_ID "$AZURE_PRINCIPAL_ID"
          azd provision --no-prompt
        shell: bash

      - name: Deploy Application
        run: azd deploy --no-prompt
