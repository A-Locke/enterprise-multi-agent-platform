name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-bicep:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Az CLI login-free Bicep build
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Bicep lint
        run: az bicep lint --file infra/main.bicep

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy app

      - name: Pytest
        run: pytest -v

  validate-deploy:
    name: Validate Deployment (what-if)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_PRINCIPAL_ID: ${{ secrets.AZURE_PRINCIPAL_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ secrets.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}
      BUDGET_NOTIFICATION_EMAIL: ${{ secrets.BUDGET_NOTIFICATION_EMAIL }}
      APIM_PUBLISHER_EMAIL: ${{ secrets.APIM_PUBLISHER_EMAIL }}
      APIM_PUBLISHER_NAME: ${{ secrets.APIM_PUBLISHER_NAME }}
      AZURE_API_APP_CLIENT_ID: ${{ secrets.AZURE_API_APP_CLIENT_ID }}
      LOCAL_DEV_PRINCIPAL_ID: ${{ secrets.LOCAL_DEV_PRINCIPAL_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in with Azure (Federated Credentials)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"
        shell: bash

      - name: What-if preview (no changes applied)
        # `azd provision --preview` reuses azd's own ${VAR} parameter substitution
        # (infra/main.parameters.json), unlike a raw `az deployment ... what-if` call which
        # would need the same env-var resolution reimplemented separately -- see
        # .github/workflows/azure-dev.yml for why azd env new/set need these values passed
        # explicitly rather than relying on process env alone.
        run: |
          azd env new "$AZURE_ENV_NAME" --subscription "$AZURE_SUBSCRIPTION_ID" --location "$AZURE_LOCATION" --no-prompt
          azd env set AZURE_PRINCIPAL_ID "$AZURE_PRINCIPAL_ID"
          azd provision --preview
        shell: bash

  # Added as each milestone introduces the corresponding app:
  # - apps/functions (pytest)
  # - apps/web (lint, type-check, unit tests)
